# Install as .github/workflows/cicd-sheriff.yml. Paths below assume this layout in the adopting
# repository: ci/check_readme_workflows.py, ci/tests/, skills/cicd-sheriff/,
# routines/cicd-sheriff/PROMPT.md.
name: CI/CD Sheriff

on:
  schedule:
    # Three times each weekday, in the team's morning, midday and afternoon (UTC hours).
    - cron: "0 7,11,15 * * 1-5"
  workflow_dispatch:
    inputs:
      repair:
        description: "Allow autonomous repair after detection"
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/cicd-sheriff.yml"
      - "skills/cicd-sheriff/**"
      - "ci/**"
      - "routines/cicd-sheriff/**"
      - "README.md"

concurrency:
  group: >-
    cicd-sheriff-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || 'repair' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      red: ${{ steps.status.outputs.red }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the detector and workflow contract
        run: python -m unittest discover -s ci/tests -p "test_*.py"

      - name: Check README workflow statuses
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 ci/check_readme_workflows.py --json > cicd-status.json
          status=$?
          set -e

          case "$status" in
            0)
              echo "red=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "red=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "::error::The CI/CD sheriff could not read every README workflow."
              cat cicd-status.json
              exit 1
              ;;
            *)
              echo "::error::Unexpected detector exit code: $status"
              exit "$status"
              ;;
          esac

          cat cicd-status.json

      - name: Upload status snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cicd-sheriff-status
          path: cicd-status.json
          if-no-files-found: error

  repair:
    needs: detect
    if: >-
      needs.detect.outputs.red == 'true' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.repair == true &&
          github.ref == 'refs/heads/master'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      # Exchanged for the Claude GitHub App token the agent runs as. GitHub forbids the
      # Actions token from opening pull requests, which is the agent's whole output.
      id-token: write
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Exclude transient handoff
        run: echo "/.cicd-sheriff-handoff.txt" >> .git/info/exclude

      - name: Load committed sheriff prompt
        id: prompt
        run: |
          {
            echo "text<<CICD_SHERIFF_PROMPT"
            cat routines/cicd-sheriff/PROMPT.md
            echo "CICD_SHERIFF_PROMPT"
          } >> "$GITHUB_OUTPUT"

      # Pinned to a full commit SHA, since the repair job's write permissions reach whatever code
      # the tag points to.
      - name: Diagnose and repair red workflows
        id: agent
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          CICD_SHERIFF_HANDOFF: ${{ github.workspace }}/.cicd-sheriff-handoff.txt
          CICD_SHERIFF_REVIEWER: ${{ vars.CICD_SHERIFF_REVIEWER }}
          # The agent's own GH_TOKEN is the app token, which reads Actions but cannot
          # re-run a workflow. Only the Actions token carries that write.
          GH_RERUN_TOKEN: ${{ github.token }}
        with:
          # The original picks this token from a pool of accounts' secrets (a repository variable
          # names them); see autoreview's references/HEURISTICS.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash"

      # Runs after the agent exits, so the chat token is never in the agent's environment.
      - name: Post intervention to the engineering channel
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          CICD_SHERIFF_HANDOFF: ${{ github.workspace }}/.cicd-sheriff-handoff.txt
          CHAT_BOT_TOKEN: ${{ secrets.CHAT_BOT_TOKEN }}
          CHAT_CHANNEL: ${{ vars.CHAT_ENG_CHANNEL }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s "$CICD_SHERIFF_HANDOFF" ]; then
            if [ "$AGENT_OUTCOME" = "success" ]; then
              echo "No intervention handoff; the team chat remains silent."
              exit 0
            fi
            printf 'CI/CD Sheriff could not finish a red-status investigation. <%s|Open the run>.' \
              "$RUN_URL" > "$CICD_SHERIFF_HANDOFF"
          fi

          if [ -z "$CHAT_BOT_TOKEN" ]; then
            echo "::error::The CHAT_BOT_TOKEN secret is missing."
            exit 1
          fi

          payload=$(jq -n \
            --arg channel "$CHAT_CHANNEL" \
            --rawfile text "$CICD_SHERIFF_HANDOFF" \
            '{channel: $channel, text: $text}')
          # Placeholder endpoint: your team chat's post-message API.
          response=$(curl --silent --show-error --fail-with-body \
            --request POST "https://chat.example.com/api/messages" \
            --header "Authorization: Bearer ${CHAT_BOT_TOKEN}" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$payload")
          if ! jq -e '.ok == true' >/dev/null <<< "$response"; then
            error=$(jq -r '.error // "unknown_error"' <<< "$response")
            echo "::error::The team chat rejected the CI sheriff handoff: $error"
            exit 1
          fi
