# Install as .github/workflows/issues-in-progress.yml, with issues_in_progress.py and
# tools/github-rest/rest.py both in github/.
name: Move issues with a PR to In progress

# Moves the issues a pull request's description declares ("Fixes #N", "Part of #N") to In progress
# on the project board (github/issues_in_progress.py). Edits count too, since a description
# can gain its issue line after the PR opens.
on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

jobs:
  move:
    # Forks get no secrets; a closed PR's description edits move nothing.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # master's script, never the PR's: this step runs with PROJECT_BOARD_TOKEN, and the
          # script needs nothing from the PR but the event payload.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: github

      # The workflow token cannot edit an organization's boards; PROJECT_BOARD_TOKEN can
      # (organization Projects: read and write; this repository's Issues and Pull requests: read).
      - name: Move the declared issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_BOARD_NUMBER }}
        run: python3 github/issues_in_progress.py "$GITHUB_EVENT_PATH"
