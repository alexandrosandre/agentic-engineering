# Install as .github/workflows/stale.yml.
name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  close-issues:
    runs-on: ubuntu-slim
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 7
          stale-issue-label: "Stale"
          stale-issue-message: "This issue is stale because it has been open for 90 days with no activity. If no one comments, this issue will close within 7 days."
          close-issue-message: "This issue was closed because it has been inactive for 7 days since being marked as stale."
          days-before-pr-stale: 45
          days-before-pr-close: 7
          stale-pr-label: "Stale"
          delete-branch: False
          stale-pr-message: "This PR is stale because it has been open for 45 days with no activity. If no one comments, this PR will close within 7 days."
          close-pr-message: "This PR was closed because it has been inactive for 7 days since being marked as stale."
          repo-token: ${{ secrets.GITHUB_TOKEN }}
